<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Programa Protagonistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  /* Painel de curadoria: lista de candidaturas à esquerda, ficha completa à direita. */
  :root {
    --bg: #0B3A78; --bg-2: #0A326A; --bg-3: #092D61; --line: rgba(160,175,200,.2);
    --text: #F1F4F8; --muted: #C3CBD6; --dim: #9AA6BA;
    --gold: #E8B85A; --ink-gold: #241A0C; --sky: #9FD6F2;
    --high: #7FD89A; --mid: #F2C26A; --low: #F0917F;
    --display: 'Manrope', system-ui, sans-serif; --body: 'Work Sans', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-3); color: var(--text); font: 15px/1.55 var(--body); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .item:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { font-family: var(--display); margin: 0; }

  .btn { border: 1px solid transparent; border-radius: 100px; padding: 10px 18px; font: 700 13px var(--display); letter-spacing: .04em; }
  .btn-gold { background: var(--gold); color: var(--ink-gold); }
  .btn-line { background: transparent; border-color: rgba(200,210,225,.35); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login form { width: min(100%, 380px); background: var(--bg); border: 1px solid var(--line); border-radius: 22px; padding: 32px 28px; display: grid; gap: 14px; }
  .login p { margin: 0; color: var(--muted); font-size: 14px; }
  .field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-3); }
  .err { color: var(--low); font-size: 14px; margin: 0; }

  /* App */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  header h1 { font-size: 16px; letter-spacing: .06em; flex: 1 1 auto; }
  header h1 span { color: var(--gold); }
  header a { color: var(--sky); font-size: 13px; }
  .toolbar { padding: 14px 16px 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1 1 100%; padding-bottom: 4px; }
  .chip { flex: none; border: 1px solid rgba(160,175,200,.35); background: transparent; border-radius: 100px; padding: 8px 14px; font: 700 12px var(--display); letter-spacing: .04em; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--ink-gold); }
  .chip b { font-weight: 800; margin-left: 4px; opacity: .8; }
  .toolbar select, .toolbar input { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
  .toolbar input { flex: 1 1 200px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; align-items: center; }
  .progress { font-size: 13px; color: var(--sky); }

  main { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
  .list { display: grid; gap: 8px; }
  .item { text-align: left; width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
  .item[aria-current="true"] { border-color: var(--gold); }
  .item .name { font: 800 15px var(--display); }
  .item .meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .score { font: 800 14px var(--display); min-width: 44px; text-align: center; padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,.06); color: var(--dim); }
  .score.alta { color: var(--high); background: rgba(127,216,154,.12); }
  .score.média { color: var(--mid); background: rgba(242,194,106,.12); }
  .score.baixa { color: var(--low); background: rgba(240,145,127,.12); }
  .pill { font: 700 11px var(--display); letter-spacing: .06em; padding: 2px 8px; border-radius: 100px; border: 1px solid var(--line); color: var(--muted); }
  .empty { padding: 30px 18px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--muted); }

  .detail { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 22px; min-width: 0; position: sticky; top: 70px; max-height: calc(100vh - 86px); overflow: auto; }
  .detail h2 { font-size: 24px; }
  .opp { color: var(--gold); font: 700 14px var(--display); margin: 4px 0 12px; }
  .contact { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--muted); margin: 0 0 16px; }
  .contact span { user-select: all; }
  .section { border-top: 1px solid var(--line); padding: 16px 0; }
  .label { font: 700 11.5px var(--display); letter-spacing: .12em; color: var(--sky); margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  textarea.field { resize: vertical; min-height: 70px; }
  .ia-head { display: flex; align-items: center; gap: 14px; margin: 0 0 10px; }
  .big { font: 800 34px/1 var(--display); padding: 8px 12px; border-radius: 12px; }
  .reqs { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 10px 0; }
  .reqs td { border-top: 1px solid var(--line); padding: 8px 6px; vertical-align: top; }
  .reqs td:nth-child(2) { white-space: nowrap; font-weight: 600; }
  .ok { color: var(--high); } .part { color: var(--mid); } .no { color: var(--low); } .na { color: var(--dim); }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 0 0 4px; }
  .answer { margin: 0 0 14px; }
  .answer p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer .q { font-weight: 600; color: var(--muted); font-size: 13.5px; margin: 0 0 2px; }
  .note { font-size: 12.5px; color: var(--dim); margin: 8px 0 0; }
  .compare { margin: 12px 16px 0; background: var(--bg); border: 1px solid rgba(232,184,90,.45); border-radius: 16px; padding: 16px 18px; }
  .compare ol { margin: 8px 0 0; padding-left: 20px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #111a33; border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
  .back { display: none; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    .detail { position: static; max-height: none; }
    main.showing-detail .list-wrap { display: none; }
    main:not(.showing-detail) .detail { display: none; }
    .back { display: inline-block; margin: 0 0 12px; }
    .reqs tr { display: block; border-top: 1px solid var(--line); padding: 8px 0; }
    .reqs td { display: block; border: 0; padding: 1px 0; }
  }
</style>
</head>
<body>

<section class="login" id="login">
  <form id="login-form">
    <h1>Painel de candidaturas</h1>
    <p>Programa Protagonistas · Academia da Magia</p>
    <label for="login-email" class="label" style="margin:6px 0 0">E-mail</label>
    <input id="login-email" class="field" type="email" autocomplete="username" required>
    <label for="pw" class="label" style="margin:6px 0 0">Senha</label>
    <input id="pw" class="field" type="password" autocomplete="current-password" required>
    <p class="err" id="login-err" role="alert" hidden></p>
    <button class="btn btn-gold" type="submit">ENTRAR</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <h1>PROTAGONISTAS <span>· CANDIDATURAS</span></h1>
    <button class="btn btn-line" id="csv" type="button">Baixar CSV</button>
    <button class="btn btn-line" id="reload" type="button">Atualizar</button>
    <button class="btn btn-line" id="logout" type="button">Sair</button>
  </header>

  <div class="toolbar">
    <div class="chips" id="opp-chips" role="group" aria-label="Filtrar por oportunidade"></div>
    <select id="status-filter" aria-label="Filtrar por status"></select>
    <select id="sort" aria-label="Ordenar">
      <option value="nota">Ordenar: maior aderência (IA)</option>
      <option value="data">Ordenar: mais recentes</option>
    </select>
    <input id="q" type="search" placeholder="Buscar por nome, e-mail ou cidade" aria-label="Buscar">
  </div>

  <div class="actions">
    <button class="btn btn-gold" id="analyze-all" type="button">ANALISAR PENDENTES COM IA</button>
    <button class="btn btn-line" id="compare" type="button" hidden>COMPARAR CANDIDATOS COM IA</button>
    <span class="progress" id="progress" role="status"></span>
  </div>
  <div class="compare" id="compare-box" hidden></div>

  <main id="main">
    <div class="list-wrap">
      <div class="list" id="list"></div>
    </div>
    <article class="detail" id="detail" aria-live="polite"></article>
  </main>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="../assets/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
