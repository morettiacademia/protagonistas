<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Programa Protagonistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  /* Painel de curadoria: lista de candidaturas à esquerda, ficha completa à direita. */
  :root {
    --bg: #0B3A78; --bg-2: #0A326A; --bg-3: #092D61; --line: rgba(160,175,200,.2);
    --text: #F1F4F8; --muted: #C3CBD6; --dim: #9AA6BA;
    --gold: #E8B85A; --ink-gold: #241A0C; --sky: #9FD6F2;
    --high: #7FD89A; --mid: #F2C26A; --low: #F0917F;
    --display: 'Manrope', system-ui, sans-serif; --body: 'Work Sans', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-3); color: var(--text); font: 15px/1.55 var(--body); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .item:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { font-family: var(--display); margin: 0; }

  .btn { border: 1px solid transparent; border-radius: 100px; padding: 10px 18px; font: 700 13px var(--display); letter-spacing: .04em; }
  .btn-gold { background: var(--gold); color: var(--ink-gold); }
  .btn-line { background: transparent; border-color: rgba(200,210,225,.35); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login form { width: min(100%, 380px); background: var(--bg); border: 1px solid var(--line); border-radius: 22px; padding: 32px 28px; display: grid; gap: 14px; }
  .login p { margin: 0; color: var(--muted); font-size: 14px; }
  .field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-3); }
  .err { color: var(--low); font-size: 14px; margin: 0; }

  /* App */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  header h1 { font-size: 16px; letter-spacing: .06em; flex: 1 1 auto; }
  header h1 span { color: var(--gold); }
  header a { color: var(--sky); font-size: 13px; }
  .toolbar { padding: 14px 16px 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1 1 100%; padding-bottom: 4px; }
  .chip { flex: none; border: 1px solid rgba(160,175,200,.35); background: transparent; border-radius: 100px; padding: 8px 14px; font: 700 12px var(--display); letter-spacing: .04em; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--ink-gold); }
  .chip b { font-weight: 800; margin-left: 4px; opacity: .8; }
  .toolbar select, .toolbar input { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
  .toolbar input { flex: 1 1 200px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; align-items: center; }
  .progress { font-size: 13px; color: var(--sky); }

  main { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
  .list { display: grid; gap: 8px; }
  .item { text-align: left; width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
  .item[aria-current="true"] { border-color: var(--gold); }
  .item .name { font: 800 15px var(--display); }
  .item .meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .score { font: 800 14px var(--display); min-width: 44px; text-align: center; padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,.06); color: var(--dim); }
  .score.alta { color: var(--high); background: rgba(127,216,154,.12); }
  .score.média { color: var(--mid); background: rgba(242,194,106,.12); }
  .score.baixa { color: var(--low); background: rgba(240,145,127,.12); }
  .pill { font: 700 11px var(--display); letter-spacing: .06em; padding: 2px 8px; border-radius: 100px; border: 1px solid var(--line); color: var(--muted); }
  .empty { padding: 30px 18px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--muted); }

  .detail { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 22px; min-width: 0; position: sticky; top: 70px; max-height: calc(100vh - 86px); overflow: auto; }
  .detail h2 { font-size: 24px; }
  .opp { color: var(--gold); font: 700 14px var(--display); margin: 4px 0 12px; }
  .contact { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--muted); margin: 0 0 16px; }
  .contact span { user-select: all; }
  .section { border-top: 1px solid var(--line); padding: 16px 0; }
  .label { font: 700 11.5px var(--display); letter-spacing: .12em; color: var(--sky); margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  textarea.field { resize: vertical; min-height: 70px; }
  .ia-head { display: flex; align-items: center; gap: 14px; margin: 0 0 10px; }
  .big { font: 800 34px/1 var(--display); padding: 8px 12px; border-radius: 12px; }
  .reqs { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 10px 0; }
  .reqs td { border-top: 1px solid var(--line); padding: 8px 6px; vertical-align: top; }
  .reqs td:nth-child(2) { white-space: nowrap; font-weight: 600; }
  .ok { color: var(--high); } .part { color: var(--mid); } .no { color: var(--low); } .na { color: var(--dim); }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 0 0 4px; }
  .answer { margin: 0 0 14px; }
  .answer p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer .q { font-weight: 600; color: var(--muted); font-size: 13.5px; margin: 0 0 2px; }
  .note { font-size: 12.5px; color: var(--dim); margin: 8px 0 0; }
  .compare { margin: 12px 16px 0; background: var(--bg); border: 1px solid rgba(232,184,90,.45); border-radius: 16px; padding: 16px 18px; }
  .compare ol { margin: 8px 0 0; padding-left: 20px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #111a33; border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
  .back { display: none; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    .detail { position: static; max-height: none; }
    main.showing-detail .list-wrap { display: none; }
    main:not(.showing-detail) .detail { display: none; }
    .back { display: inline-block; margin: 0 0 12px; }
    .reqs tr { display: block; border-top: 1px solid var(--line); padding: 8px 0; }
    .reqs td { display: block; border: 0; padding: 1px 0; }
  }
</style>
</head>
<body>

<section class="login" id="login">
  <form id="login-form">
    <h1>Painel de candidaturas</h1>
    <p>Programa Protagonistas · Academia da Magia</p>
    <label for="pw" class="label" style="margin:6px 0 0">Senha</label>
    <input id="pw" class="field" type="password" autocomplete="current-password" required>
    <p class="err" id="login-err" role="alert" hidden></p>
    <button class="btn btn-gold" type="submit">ENTRAR</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <h1>PROTAGONISTAS <span>· CANDIDATURAS</span></h1>
    <a id="sheet-link" href="#" target="_blank" rel="noopener">Abrir planilha</a>
    <button class="btn btn-line" id="reload" type="button">Atualizar</button>
    <button class="btn btn-line" id="logout" type="button">Sair</button>
  </header>

  <div class="toolbar">
    <div class="chips" id="opp-chips" role="group" aria-label="Filtrar por oportunidade"></div>
    <select id="status-filter" aria-label="Filtrar por status"></select>
    <select id="sort" aria-label="Ordenar">
      <option value="nota">Ordenar: maior aderência (IA)</option>
      <option value="data">Ordenar: mais recentes</option>
    </select>
    <input id="q" type="search" placeholder="Buscar por nome, e-mail ou cidade" aria-label="Buscar">
  </div>

  <div class="actions">
    <button class="btn btn-gold" id="analyze-all" type="button">ANALISAR PENDENTES COM IA</button>
    <button class="btn btn-line" id="compare" type="button" hidden>COMPARAR CANDIDATOS COM IA</button>
    <span class="progress" id="progress" role="status"></span>
  </div>
  <div class="compare" id="compare-box" hidden></div>

  <main id="main">
    <div class="list-wrap">
      <div class="list" id="list"></div>
    </div>
    <article class="detail" id="detail" aria-live="polite"></article>
  </main>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  var state = { token: null, apps: [], statuses: [], opp: 'todas', status: 'todos', sort: 'nota', q: '', selected: null, iaOk: false, busy: false };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var norm = function (s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };

  try { state.token = sessionStorage.getItem('pp_token'); } catch (e) {}

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
        var msg = (err && err.message) || String(err);
        if (msg.indexOf('SESSAO_EXPIRADA') >= 0) { logout(); reject(new Error('Sua sessão expirou. Entre de novo.')); }
        else reject(new Error(msg));
      });
      runner[fn].apply(runner, args);
    });
  }

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 4200);
  }

  function logout() {
    state.token = null;
    try { sessionStorage.removeItem('pp_token'); } catch (e) {}
    $('app').hidden = true; $('login').hidden = false; $('pw').value = ''; $('pw').focus();
  }

  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = $('login-err'); err.hidden = true;
    call('adminLogin', $('pw').value).then(function (token) {
      state.token = token;
      try { sessionStorage.setItem('pp_token', token); } catch (e2) {}
      load();
    }).catch(function (e3) { err.textContent = e3.message; err.hidden = false; });
  });

  $('logout').addEventListener('click', logout);
  $('reload').addEventListener('click', function () { load(); });

  function load() {
    return call('adminList', state.token).then(function (data) {
      state.apps = data.candidaturas;
      state.statuses = data.status;
      state.iaOk = data.iaDisponivel;
      $('sheet-link').href = data.planilha;
      $('login').hidden = true; $('app').hidden = false;
      renderFilters(); render();
    }).catch(function (e) { toast(e.message); });
  }

  function opps() {
    var map = {};
    state.apps.forEach(function (a) {
      map[a.oportunidade] = map[a.oportunidade] || { slug: a.oportunidade, titulo: a.oportunidadeTitulo || a.oportunidade, n: 0 };
      map[a.oportunidade].n++;
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.n - a.n; });
  }

  function renderFilters() {
    var list = [{ slug: 'todas', titulo: 'Todas', n: state.apps.length }].concat(opps());
    $('opp-chips').innerHTML = list.map(function (o) {
      return '<button type="button" class="chip" data-opp="' + esc(o.slug) + '" aria-pressed="' + (o.slug === state.opp) + '">' + esc(o.titulo) + '<b>' + o.n + '</b></button>';
    }).join('');
    $('status-filter').innerHTML = '<option value="todos">Todos os status</option>' + state.statuses.map(function (s) {
      return '<option' + (s === state.status ? ' selected' : '') + '>' + esc(s) + '</option>';
    }).join('');
  }

  $('opp-chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-opp]'); if (!b) return;
    state.opp = b.getAttribute('data-opp');
    $('compare-box').hidden = true;
    renderFilters(); render();
  });
  $('status-filter').addEventListener('change', function (e) { state.status = e.target.value; render(); });
  $('sort').addEventListener('change', function (e) { state.sort = e.target.value; render(); });
  $('q').addEventListener('input', function (e) { state.q = e.target.value; render(); });

  function visible() {
    var q = norm(state.q);
    return state.apps.filter(function (a) {
      return (state.opp === 'todas' || a.oportunidade === state.opp) &&
        (state.status === 'todos' || a.status === state.status) &&
        (!q || norm(a.nome + ' ' + a.email + ' ' + a.cidade).indexOf(q) >= 0);
    }).sort(function (a, b) {
      if (state.sort === 'nota') {
        var na = a.ia ? a.ia.nota : -1, nb = b.ia ? b.ia.nota : -1;
        if (na !== nb) return nb - na;
      }
      return String(b.recebidaEm).localeCompare(String(a.recebidaEm));
    });
  }

  function fmtDate(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function scoreBadge(a, cls) {
    if (!a.ia) return '<span class="score ' + (cls || '') + '" title="Ainda não analisada">—</span>';
    return '<span class="score ' + esc(a.ia.aderencia) + ' ' + (cls || '') + '" title="Aderência ' + esc(a.ia.aderencia) + '">' + a.ia.nota + '</span>';
  }

  function render() {
    var items = visible();
    var pending = items.filter(function (a) { return !a.ia; });
    $('analyze-all').textContent = 'ANALISAR PENDENTES COM IA (' + pending.length + ')';
    $('analyze-all').disabled = state.busy || !pending.length || !state.iaOk;
    $('analyze-all').title = state.iaOk ? '' : 'Configure ANTHROPIC_API_KEY no Apps Script para usar a IA.';
    $('compare').hidden = state.opp === 'todas';
    $('compare').disabled = state.busy || !state.iaOk || items.filter(function (a) { return a.ia; }).length < 2;

    $('list').innerHTML = items.length ? items.map(function (a) {
      return '<button type="button" class="item" data-id="' + esc(a.id) + '" aria-current="' + (a.id === state.selected) + '">' +
        '<span class="name">' + esc(a.nome || '(sem nome)') + '</span>' + scoreBadge(a) +
        '<span class="meta"><span>' + esc(a.oportunidadeTitulo) + '</span><span>' + esc(fmtDate(a.recebidaEm)) + '</span><span class="pill">' + esc(a.status) + '</span></span>' +
        '</button>';
    }).join('') : '<div class="empty">Nenhuma candidatura com esses filtros.</div>';

    var sel = state.apps.filter(function (a) { return a.id === state.selected; })[0];
    renderDetail(sel);
  }

  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-id]'); if (!b) return;
    state.selected = b.getAttribute('data-id');
    $('main').classList.add('showing-detail');
    render();
    $('detail').scrollTop = 0;
    if (window.matchMedia('(max-width: 820px)').matches) window.scrollTo({ top: $('main').offsetTop - 60 });
  });

  var SIT = { 'atende': ['ok', '✓ atende'], 'parcial': ['part', '◐ parcial'], 'não atende': ['no', '✗ não atende'], 'não informado': ['na', '? não informado'] };

  function renderIa(a) {
    if (!a.ia) {
      return '<p class="note">Esta candidatura ainda não foi analisada pela IA.</p>' +
        '<div class="row" style="margin-top:10px"><button class="btn btn-gold" type="button" data-analyze' + (state.iaOk && !state.busy ? '' : ' disabled') + '>ANALISAR COM IA</button></div>';
    }
    var ia = a.ia;
    var list = function (arr) { return arr && arr.length ? '<ul>' + arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<p class="note">—</p>'; };
    return '<div class="ia-head">' + scoreBadge(a, 'big') + '<div><strong>Aderência ' + esc(ia.aderencia) + '</strong><p class="note" style="margin:2px 0 0">Analisada em ' + esc(fmtDate(a.iaAnalisadaEm)) + '</p></div></div>' +
      '<p style="margin:0 0 6px">' + esc(ia.resumo) + '</p>' +
      (ia.requisitos && ia.requisitos.length ? '<table class="reqs"><tbody>' + ia.requisitos.map(function (r) {
        var s = SIT[r.situacao] || ['na', r.situacao];
        return '<tr><td>' + esc(r.requisito) + '</td><td class="' + s[0] + '">' + esc(s[1]) + '</td><td>' + esc(r.evidencia) + '</td></tr>';
      }).join('') + '</tbody></table>' : '') +
      '<div class="cols"><div><p class="label">PONTOS FORTES</p>' + list(ia.pontosFortes) + '</div><div><p class="label">PONTOS DE ATENÇÃO</p>' + list(ia.pontosDeAtencao) + '</div></div>' +
      '<p class="label" style="margin-top:14px">PERGUNTAS PARA A CONVERSA</p>' + list(ia.perguntasEntrevista) +
      '<p class="note">A análise da IA é um apoio à curadoria. A decisão é sempre do time.</p>' +
      '<div class="row" style="margin-top:10px"><button class="btn btn-line" type="button" data-analyze' + (state.iaOk && !state.busy ? '' : ' disabled') + '>REANALISAR</button></div>';
  }

  function renderDetail(a) {
    var d = $('detail');
    if (!a) { d.innerHTML = '<div class="empty">Selecione uma candidatura para ver as respostas e a análise.</div>'; return; }
    d.innerHTML =
      '<button type="button" class="btn btn-line back" data-back>← Voltar à lista</button>' +
      '<h2>' + esc(a.nome) + '</h2>' +
      '<p class="opp">' + esc(a.oportunidadeTitulo) + '</p>' +
      '<p class="contact"><span>' + esc(a.email) + '</span><span>' + esc(a.whatsapp) + '</span><span>' + esc(a.cidade) + '</span><span>' + esc(a.relacao) + '</span></p>' +
      '<div class="section"><p class="label">CURADORIA</p>' +
        '<div class="row"><label for="st" class="note" style="margin:0">Status</label><select id="st" class="field" style="width:auto">' +
          state.statuses.map(function (s) { return '<option' + (s === a.status ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
        '</select></div>' +
        '<label for="notes" class="note" style="display:block;margin:12px 0 6px">Anotações do time</label>' +
        '<textarea id="notes" class="field">' + esc(a.notas) + '</textarea>' +
        '<div class="row" style="margin-top:10px"><button class="btn btn-gold" type="button" data-save>SALVAR</button></div>' +
      '</div>' +
      '<div class="section"><p class="label">ANÁLISE DA IA</p>' + renderIa(a) + '</div>' +
      '<div class="section"><p class="label">RESPOSTAS</p>' + a.respostas.map(function (r) {
        return '<div class="answer"><p class="q">' + esc(r.label) + '</p><p>' + (r.valor ? esc(r.valor) : '<span class="note">—</span>') + '</p></div>';
      }).join('') + '<p class="note">Recebida em ' + esc(fmtDate(a.recebidaEm)) + ' · código ' + esc(a.id) + '</p></div>';
  }

  $('detail').addEventListener('click', function (e) {
    var a = state.apps.filter(function (x) { return x.id === state.selected; })[0];
    if (!a) return;
    if (e.target.closest('[data-back]')) { $('main').classList.remove('showing-detail'); return; }
    if (e.target.closest('[data-save]')) {
      var patch = { status: $('st').value, notas: $('notes').value };
      call('adminUpdate', state.token, a.id, patch).then(function () {
        a.status = patch.status; a.notas = patch.notas; toast('Salvo.'); render();
      }).catch(function (err) { toast(err.message); });
    }
    if (e.target.closest('[data-analyze]')) analyzeOne(a).then(render);
  });

  function analyzeOne(a) {
    state.busy = true; render();
    $('progress').textContent = 'Analisando ' + a.nome + '…';
    return call('adminAnalyze', state.token, a.id).then(function (res) {
      a.ia = res.ia; a.iaAnalisadaEm = res.iaAnalisadaEm;
      if (a.status === 'Nova') a.status = 'Em análise';
    }).catch(function (err) { toast(a.nome + ': ' + err.message); })
      .then(function () { state.busy = false; $('progress').textContent = ''; });
  }

  $('analyze-all').addEventListener('click', function () {
    var queue = visible().filter(function (a) { return !a.ia; });
    var i = 0;
    (function next() {
      if (i >= queue.length) { render(); toast('Análise concluída.'); return; }
      var a = queue[i++];
      analyzeOne(a).then(function () { render(); $('progress').textContent = i < queue.length ? 'Analisadas ' + i + ' de ' + queue.length + '…' : ''; next(); });
    })();
  });

  $('compare').addEventListener('click', function () {
    var box = $('compare-box');
    state.busy = true; render();
    $('progress').textContent = 'Comparando candidatos…';
    call('adminCompare', state.token, state.opp).then(function (out) {
      box.innerHTML = '<p class="label">COMPARAÇÃO DA IA · ' + esc((opps().filter(function (o) { return o.slug === state.opp; })[0] || {}).titulo) + '</p>' +
        '<p style="margin:0">' + esc(out.recomendacao) + '</p>' +
        '<ol>' + out.ranking.map(function (r) { return '<li><strong>' + esc(r.nome) + '</strong> — ' + esc(r.justificativa) + '</li>'; }).join('') + '</ol>' +
        '<p class="note">Considera só as candidaturas já analisadas e que não estão como “Não selecionada”. A decisão é do time.</p>';
      box.hidden = false;
    }).catch(function (err) { toast(err.message); })
      .then(function () { state.busy = false; $('progress').textContent = ''; render(); });
  });

  if (state.token) load(); else $('login').hidden = false;
})();
</script>
</body>
</html>
