# Publica o hub do Programa Protagonistas (pasta protagonistas/) no GitHub Pages,
# em https://protagonistas.academiadamagia.com.br. Roda a cada push na branch padrão do repositório
# (hoje claude/new-session-nzbzek; se ela mudar, atualize a lista abaixo).
name: Publicar site

on:
  push:
    branches: [claude/new-session-nzbzek]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar páginas
        run: node scripts/build-protagonistas.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: protagonistas
      - id: deployment
        uses: actions/deploy-pages@v4
